    <style>
        .lang-price-table-wrapper {
            overflow-x: auto;
            margin-top: 2rem;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.06);
        }
        .lang-price-table {
            width: 100%;
            border-collapse: collapse;
            background: #ffffff;
            min-width: 640px;
        }
        .lang-price-table thead th {
            text-align: left;
            padding: 16px 20px;
            background: #1a1a2e;
            color: #ffffff;
            font-family: 'Playfair Display', serif;
            font-weight: 600;
            font-size: 0.95rem;
            letter-spacing: 0.02em;
        }
        .lang-price-table tbody td {
            padding: 14px 20px;
            border-bottom: 1px solid #eaeaea;
            font-family: 'Nunito Sans', sans-serif;
            font-size: 0.95rem;
            color: #333;
        }
        .lang-price-table tbody tr:last-child td {
            border-bottom: none;
        }
        .lang-price-table tbody tr:nth-child(even) {
            background: #f9f9fb;
        }
        .lang-price-table tbody tr:hover {
            background: #f0f2fa;
        }
        .lang-name-cell {
            font-weight: 600;
            white-space: nowrap;
        }
        .lang-flag {
            margin-right: 8px;
        }
        .lang-price-note {
            margin-top: 1.25rem;
            text-align: center;
            font-family: 'Nunito Sans', sans-serif;
            font-size: 0.95rem;
            color: #666;
            font-style: italic;
        }
        @media (max-width: 640px) {
            .lang-price-table thead th,
            .lang-price-table tbody td {
                padding: 10px 12px;
                font-size: 0.85rem;
            }
        }
    </style>

    <style>
        .other-services-grid {
            display: grid;

        .other-service-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 16px 20px;
            background: #f9f9fb;
            border: 1px solid #eaeaea;
            border-radius: 10px;

        .other-service-item:hover {
